[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Evidence-driven investigations of historical financial claims"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2.11,<3",
    "streamlit>=1.56,<2",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "playwright>=1.51,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
